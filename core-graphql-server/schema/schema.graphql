  """
  Create one or more ingest slugs in bulk.

  This mutation creates ingest slug records for files, enabling tracking through
  the ingestion pipeline. It supports batch processing (up to 1000 files per batch),
  returns both successful creations and failures, and validates sourceId and optional
  engineId and appId parameters. The organizationId is retrieved from the user's
  authorization context.

  Requires scope: superadmin OR aiware.slug.create

  Example: Create multiple ingest slugs for a video source:
  mutation {
    ingestSlugsCreate(
      input: {
        sourceId: "100"
        files: [
          {
            fileUri: "s3://bucket/videos/file1.mp4"
            bundleKey: "bundle-001"
            mimeType: "video/mp4"
            fileSizeBytes: 2147483648
            fileCreatedAt: "2024-01-15T10:00:00Z"
            fileModifiedAt: "2024-01-15T10:30:00Z"
            status: "pending"
          },
          {
            fileUri: "s3://bucket/videos/file2.mov"
            bundleKey: "bundle-001"
            mimeType: "video/quicktime"
            fileSizeBytes: 1073741824
            fileCreatedAt: "2024-01-15T11:00:00Z"
            fileModifiedAt: "2024-01-15T11:30:00Z"
            status: "pending"
          }
        ]
        engineId: "c0e55cde-340b-44d7-bb42-2e0d65e98255"
        appId: "47bd3e25-f4ea-435f-b69b-13cb4f9dd60a"
      }
    ) {
      sourceId
      created {
        sourceId
        fileUri
        status
        bundleKey
        createdAt
      }
      failed {
        fileUri
        errorCode
        errorMessage
      }
    }
  }

  Response:
  {
    "data": {
      "ingestSlugsCreate": {
        "sourceId": "100",
        "created": [
          {
            "sourceId": "100",
            "fileUri": "s3://bucket/videos/file1.mp4",
            "status": "pending",
            "bundleKey": "bundle-001",
            "createdAt": "2024-01-15T09:00:00Z"
          },
          {
            "sourceId": "100",
            "fileUri": "s3://bucket/videos/file2.mov",
            "status": "pending",
            "bundleKey": "bundle-001",
            "createdAt": "2024-01-15T09:05:00Z"
          }
        ],
        "failed": []
      }
    }
  }

  Notes:
  - Status defaults to "pending" if not provided
  - Duplicate file URIs for the same source are ignored and returned as failures
  - engineId and appId are optional but must exist if provided
  - If tdoId is provided, the slug will be associated with that temporal data object
  - organizationId is automatically determined from the user's authorization context
  """
  ingestSlugsCreate(
      input: IngestSlugsCreateInput!
  ): IngestSlugsCreateResult
  @scopes(scopes: ["superadmin", "aiware.slug.create"], require: Any)

  """
  Update an individual ingest slug's metadata with optional conditional filtering.

  Allows updating file metadata, processing status, and TDO/asset associations
  for a specific ingest slug identified by sourceId and fileUri. Only provided fields
  are updated (partial updates are supported). The updatedAt timestamp is automatically
  updated. The sourceId is scoped to the user's organization from their authorization context.

  Optional filtering can be applied to restrict updates to slugs in a specific status,
  useful for preventing concurrent updates or ensuring updates only occur on files
  in a particular state.

  Requires scope: superadmin OR aiware.slug.update

  Example 1: Update slug status and associate with a TDO:
  mutation {
    ingestSlugUpdate(
      sourceId: "100"
      fileUri: "s3://bucket/videos/sample.mp4"
      input: {
        status: "ingested"
        statusMessage: "Successfully ingested and transcoded"
        tdoId: "1570654874"
        assetId: "1570654874_4hJtNKSUXD"
        mimeType: "video/mp4"
        fileSizeBytes: 2147483648
      }
    ) {
      sourceId
      fileUri
      status
      statusMessage
      tdoId
      assetId
      mimeType
      fileSizeBytes
      updatedAt
    }
  }

  Example 2: Update file metadata timestamps:
  mutation {
    ingestSlugUpdate(
      sourceId: "100"
      fileUri: "s3://bucket/videos/sample.mp4"
      input: {
        fileModifiedAt: "2024-01-15T14:00:00Z"
        bundleKey: "bundle-updated"
      }
    ) {
      fileModifiedAt
      bundleKey
      updatedAt
    }
  }

  Example 3: Conditional update - only update if status is currently 'pending':
  mutation {
    ingestSlugUpdate(
      sourceId: "100"
      fileUri: "s3://bucket/videos/sample.mp4"
      input: {
        status: "ingested"
        filter: {
          status: "pending"
        }
      }
    ) {
      sourceId
      fileUri
      status
      updatedAt
    }
  }

  Response:
  {
    "data": {
      "ingestSlugUpdate": {
        "sourceId": "100",
        "fileUri": "s3://bucket/videos/sample.mp4",
        "status": "ingested",
        "statusMessage": "Successfully ingested and transcoded",
        "tdoId": "1570654874",
        "assetId": "1570654874_4hJtNKSUXD",
        "mimeType": "video/mp4",
        "fileSizeBytes": 2147483648,
        "updatedAt": "2024-01-15T14:00:00Z"
      }
    }
  }

  Notes:
  - Both sourceId and fileUri are required and used as composite key
  - Any combination of updatable fields can be provided
  - TDO/asset associations are upserted
  - The returned object contains all current slug fields after the update
  - sourceId is validated to belong to the user's organization from authorization context
  - filter.status can be used to make updates conditional on current status
  - If filter.status is provided and current status doesn't match, returns null (not found)
  """
  ingestSlugUpdate(
      sourceId: ID!,
      fileUri: String!,
      input: IngestSlugUpdateInput!
  ): IngestSlug
  @scopes(scopes: ["superadmin", "aiware.slug.update"], require: Any)

  """
  Bulk update the status of multiple ingest slugs with optimized batch processing.

  The sourceId is scoped to the user's organization from their authorization context.

  Requires scope: superadmin OR aiware.slug.update

  Example 1: Mark multiple files as ingested:
  mutation {
    ingestSlugUpdateStatus(
      sourceId: "100"
      fileUris: [
        "s3://bucket/videos/file1.mp4"
        "s3://bucket/videos/file2.mp4"
        "s3://bucket/videos/file3.mp4"
      ]
      input: {
        status: "ingested"
        statusMessage: "Batch processing completed successfully"
      }
    ) {
      sourceId
      updated {
        sourceId
        fileUri
        status
        statusMessage
        updatedAt
      }
      failed {
        fileUri
        errorCode
        errorMessage
      }
    }
  }

  Example 2: Reset failed uploads back to pending:
  mutation {
    ingestSlugUpdateStatus(
      sourceId: "100"
      fileUris: [
        "s3://bucket/videos/failed1.mp4"
        "s3://bucket/videos/failed2.mp4"
      ]
      input: {
        status: "pending"
        statusMessage: "Retry after connection restored"
      }
    ) {
      sourceId
      updated {
        fileUri
        status
        updatedAt
      }
      failed {
        fileUri
        errorCode
        errorMessage
      }
    }
  }

  Response:
  {
    "data": {
      "ingestSlugUpdateStatus": {
        "sourceId": "100",
        "updated": [
          {
            "sourceId": "100",
            "fileUri": "s3://bucket/videos/file1.mp4",
            "status": "ingested",
            "statusMessage": "Batch processing completed successfully",
            "updatedAt": "2024-01-15T14:00:00Z"
          },
          {
            "sourceId": "100",
            "fileUri": "s3://bucket/videos/file2.mp4",
            "status": "ingested",
            "statusMessage": "Batch processing completed successfully",
            "updatedAt": "2024-01-15T14:00:00Z"
          },
          {
            "sourceId": "100",
            "fileUri": "s3://bucket/videos/file3.mp4",
            "status": "ingested",
            "statusMessage": "Batch processing completed successfully",
            "updatedAt": "2024-01-15T14:00:00Z"
          }
        ],
        "failed": []
      }
    }
  }

  Notes:
  - sourceId and at least one fileUri are required
  - Status is a required input, statusMessage is optional
  - All files are updated in a single efficient batch operation (single database round-trip)
  - Partial success is possible: some files may succeed while others fail
  - Possible error codes:
    * 'constraint_violation': File would violate unique constraint on (media_source_id, bundle_key) where status='ingesting'
    * 'batch_conflict': Multiple files in the batch would conflict with each other (same bundle_key)
    * 'not_found': The ingest slug does not exist for the given sourceId and fileUri
    * 'not_updated': Database error occurred during update
  - Returns full IngestSlug objects for successfully updated records
  - All updates are processed with organization security binding
  - Maximum batch limit is 1000 fileUris per request
  """
  ingestSlugUpdateStatus(
      sourceId: ID!,
      fileUris: [String!]!,
      input: IngestSlugsStatusUpdateInput!
  ): IngestSlugUpdateStatusResult
  @scopes(scopes: ["superadmin", "aiware.slug.update"], require: Any)

  """
  Delete specific ingest slug records.

  Removes ingest slug records from the system for the specified sourceId and fileUris.
  Returns IngestSlugKey objects (sourceId and fileUri pairs) for successfully deleted records.
  The sourceId is scoped to the user's organization from their authorization context.

  Requires scope: superadmin OR aiware.slug.delete

  Example: Delete specific ingest slugs:
  mutation {
    ingestSlugsDelete(
      sourceId: "100"
      fileUris: [
        "s3://bucket/videos/old_file1.mp4"
        "s3://bucket/videos/old_file2.mp4"
      ]
    ) {
      sourceId
      deleted {
        sourceId
        fileUri
      }
      failed {
        fileUri
        errorCode
        errorMessage
      }
    }
  }

  Response:
  {
    "data": {
      "ingestSlugsDelete": {
        "sourceId": "100",
        "deleted": [
          {
            "sourceId": "100",
            "fileUri": "s3://bucket/videos/old_file1.mp4"
          },
          {
            "sourceId": "100",
            "fileUri": "s3://bucket/videos/old_file2.mp4"
          }
        ],
        "failed": []
      }
    }
  }

  Notes:
  - sourceId and at least one fileUri are required
  - Returns IngestSlugKey objects (composite key with sourceId and fileUri) for each successfully deleted slug
  - Failures occur if slug not found or on database error
  - sourceId is validated to belong to the user's organization from authorization context
  """
  ingestSlugsDelete(
      sourceId: ID!
      fileUris: [String!]!
  ): IngestSlugsDeleteResult
  @scopes(scopes: ["superadmin", "aiware.slug.delete"], require: Any)

  """
  Delete all ingest slug records for a source.

  Removes all ingest slug records associated with a specific source. This operation
  is performed asynchronously and may take time for sources with many records.
  A IngestSlugsDeleteBySource event is emitted and the operation is queued for processing.
  The sourceId is scoped to the user's organization from their authorization context.

  Requires scope: superadmin OR aiware.slug.delete

  Example:
  mutation {
    ingestSlugsDeleteForSource(
      sourceId: "100"
    ) {
      message
      submitted
    }
  }

  Response:
  {
    "data": {
      "ingestSlugsDeleteForSource": {
        "message": "Deletion request submitted for source 100. Processing asynchronously.",
        "submitted": true
      }
    }
  }

  Notes:
  - This operation removes ALL ingest slugs for the source (use with caution)
  - The deletion is processed asynchronously in the background
  - sourceId is validated to belong to the user's organization from authorization context
  """
  ingestSlugsDeleteForSource(
      sourceId: ID!
  ): IngestSlugsDeleteForSourceResult!
