"""
An application is a set of Veritone functionality that customers can sign up for.
"""
type Application {
  id: ID!
  isPublic: Boolean
  metadataVersion: Int
  details: JSONData
  key: String!
    @deprecated(
      reason: "Application name/key validation issues."
      alternate: "Keys will be generated."
      expirationDate: "2024-09-20"
      deprecationDate: "2023-09-20"
    )
  name: String!
  category: String
  description: String
  iconUrl: String
  iconSvg: String
  """
  The signed URL for the application icon; will fallback to raw iconSvg if unable to sign.
  """
  signedIconSvg: String
  """
  The signed URL for the application logo; will fallback to raw iconUrl if unable to sign.
  """
  signedIconUrl: String
  url: String
  deploymentModel: DeploymentModel
  createdDateTime: DateTime
  modifiedDateTime: DateTime
  """
  OAuth2 client secret. This field is server-generated and is only
  returned on application creation.
  """
  clientSecret(password: String): String
  """
  OAuth2 redirect URLs
  """
  oauth2RedirectUrls: [String]
  organizationId: ID
  ownerOrganizationId: ID!
  status: ApplicationStatus
  permissionsRequired: [String]
  contextMenuExtensions: ContextMenuExtensionList
  validStateActions: [ApplicationStateAction]
  components: ApplicationComponent
    @deprecated(
      reason: "No longer supported. Components are replaced by package resources."
      alternate: "Package.resources"
      expirationDate: "2024-06-13"
      deprecationDate: "2023-06-13"
    )
  dailyTaskMetrics: DailyTaskMetricsList
  """
  Billing
  """
  billingPlanId: ID
  billingDirty: Boolean
  sharedWithOrganizationId: ID
  """
  The Application event endpoint.
  The event is delivered to the application via the Event Routing for Applications mechanism.
  """
  eventEndpoint: String
  """
  The tags associated with the application
  """
  entityTags: [EntityTag]
  """
  Whether or not the application will be wrapped in aiWare as an iframe
  """
  headerbarEnabled: Boolean
  """
  The subscription events with this application
  """
  eventSubscriptions: [EventSubscription]
  """
  The configs associated with this application
  """
  applicationConfig(
    offset: Int = 0
    limit: Int = 30
    """
    Optional. Organization ID.

    If not specified, this will be the user's organization
    """
    orgId: ID
    """
    Optional. If specified, returned the configs for this user and organization combo
    """
    userId: ID
    """
    If true, include defaults not specified
    """
    includeDefaults: Boolean = true
    """
    If specified, filter the configKey
    """
    configKeyRegexp: String
  ): ApplicationConfigList!
  """
  The headerbar associated with this application
  """
  applicationHeaderbar(
    """
    Optional. Organization ID.

    If not specified, this will be the user's organization
    """
    orgId: ID
  ): ApplicationHeaderbar @scopes(scopes: ["developer.access"])
  nodeModules(
    """
    Include node modules with "deleted" status
    """
    includeDeleted: Boolean = false
  ): [NodeModule]
  """
  The config definition associated with this application
  """
  applicationConfigDefinition(
    """
    If specified, grab definition for this config key
    """
    configKey: String
    """
    Specify maximum number of results to retrieve in this result. Page size.
    """
    offset: Int = 0
    """
    Specify maximum number of results to retrieve in this result.
    """
    limit: Int = 30
  ): ApplicationConfigDefinitionList

  """
  The roles of this application
  """
  applicationRoles(
    """
    If it is 'false': get all available roles
    If it is 'true': only get the roles assigned to the user in the org
    """
    ownedOnly: Boolean = true
  ): [ApplicationRole!]!
  """
  The events of this application
  """
  events: [Event!]
}

