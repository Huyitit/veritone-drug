"""
A Package is an object that groups dependent aiWARE resources together.
"""
type Package {
    """
    The UUID of the Package.
    """
    id: ID!
    """
    Details for the organization that owns the package.
    """
    organization: OrganizationInfo
    """
    The unique name of the package.
    """
    name: String!
    description: String
    """
    The path for an icon image.
    """
    icon: String
    """
    This determines how the package is distributed.
    """
    distributionType: EngineDistributionType
    """
    The semantic version of the package.
    """
    version: String!
    """
    This UUID is used to track a package's lineage and versions. This UUID is NOT guaranteed to be a package ID and should not be used as such.
    """
    sourceOriginId: ID
    """
    The source package ID of a package refers to the package it immediately derives from, if any.

    For example, if there are two packages in the same lineage with versions 1.0 and 2.0,
    the 2.0 package derives from the 1.0 package. Therefore, the source package ID of the 2.0
    package would be the ID of the 1.0 package.
    """
    sourcePackageId: ID
    """
    This specifies an aiWARE version that this package is dependent on, if applicable.
    """
    aiwareVersion: String
    deleted: Boolean
    deprecated: Boolean
    status: PackageStatus
    grantType: PackageGrantType
    """
    The date the package was installed onto the instance.
    """
    installDate: DateTime
    """
    The date the package was available for distribution. This depends on the package's status and distribution type.
    """
    distributionDate: DateTime
    """
    A flag that indicates whether the package was generated as a result of an automated process or not.
    """
    autoGenerated: Boolean

    primaryResourceId: ID
      @deprecated(
          reason: "duplicate"
          alternate: "primaryResource.resourceId"
          expirationDate: "2024-03-06"
          deprecationDate: "2023-03-06"
      )
    """
    This is the resource that the package was specifically made for. This is typically set during automatic package
    creation and is usually an engine or application.

    For example, if an application was created and a package was created for it, the application would be the package’s
    primary resource. This is especially useful because different packages might share many resources, but one package
    might have an application as a primary resource while another might have an engine as a primary resource.
    """
    primaryResource: PackageResource

    resources(
       """
       Filter results by Resource Type.
       """
       type: PackageResourceType,
       alias: String,
       offset: Int = 0,
       limit: Int = 30
    ): PackageResourceList

    """
    nestedResources will return resources that are directly or indirectly nested to this package.
    """
    nestedResources(
      """
      Filter results by Resource Type.
      """
      type: PackageResourceType,
      offset: Int = 0,
      limit: Int = 30
    ): PackageResourceList

    """
    This is the date of when the package was originally created.
    """
    createdAt: DateTime!
    modifiedAt: DateTime!

    createdBy: BasicUserInfo!
    modifiedBy: BasicUserInfo!
}

"""
The types of resources currently supported by Packages.
"""
enum PackageResourceType {
  application,
  package,
  engine,
  engineBuild,
  automateFlowRevision,
  schema,
  tdo,
  nodeRedPalette,
  automateNode,
  automateTemplate,
  automatePalette,
  applicationConfigDefinition,
  library,
}

"""
A Resource is an aiWARE asset that a package is dependent on, such as an application, engine, schema,
engine build, and so on. Refer to __PackageResourceType__ for the aiWARE assets that can be added to a package.
"""
type PackageResource {
    """
    This is a unique integer identifier for the resource entry in the database.
    Note that this is _not_ the ID of the resource itself. That would be the __resourceId__.
    """
    id: ID!
    """
    This is the ID belonging to the resource. For example, if the resource is an application,
    this would be its application ID, or if it were an engine, it would be its engine ID, and so on.
    If the resource is an automateNode the resource will be a tdo ID, if it were an automateTemplate,
    the resource will be an automate flow template ID.
    """
    resourceId: ID!
    resourceType: PackageResourceType!
    """
    This is the ID of the package that the resource belongs to.
    """
    packageId: ID!
    """
    This id should be used when referencing a resource from another resource in the same package
    since it is guaranteed to be consistent across aiware instances
    """
    resourceAlias: String

    """
    The referencePaths field is an array containing unique chains of packages that lead to the reference
    of the resource. Each item in the array represents a distinct path. It is possible for multiple
    packages to reference the same resource, and this array captures the path for each reference.
    """
    referencePaths: [String]

    createdAt: DateTime!
    modifiedAt: DateTime!

    createdBy: BasicUserInfo!
    modifiedBy: BasicUserInfo!
}

"""
Package Grants control the visibility of packages and their resources
to other organizations. If a package grant does not exist for an organization,
access will be determined by that package's distribution type.
"""
type PackageGrant {
    """
    This is the package that will have its access level defined
    for the specified organization.
    """
    package: Package!
    """
    The organization to be granted or denied access.
    """
    organization: OrganizationInfo!
    """
    This specifies whether access should be granted or denied to an organization.
    """
    grantType: PackageGrantType!

    createdAt: DateTime!
    modifiedAt: DateTime!

    createdBy: BasicUserInfo!
    modifiedBy: BasicUserInfo!
}

type PackageList {
    records: [Package]!
    offset: Int!
    limit: Int!
    count: Int!
}

type PackageResourceList {
    records: [PackageResource]!
    offset: Int!
    limit: Int!
    count: Int!
}

type PackageGrantList {
    records: [PackageGrant]!
    offset: Int!
    limit: Int!
    count: Int!
}
enum PackageGrantType {
    GRANT,
    VIEW,
    DENY
}

type PackageOpResult {
    success: Boolean!
    msg: String
    code: String
    record: Package
}

type PackageDeleteResult {
    success: Boolean!
    msg: String
    code: String
}

input PackageResourceInput {
    resourceType: PackageResourceType!
    """
    This is the ID belonging to the resource. For example, if the resource is an application,
    this would be its application ID, or if it were an engine, it would be its engine ID, and so on.
    """
    resourceId: ID!
    """
    This id should be used when referencing a resource from another resource in the same package
    since it is guaranteed to be consistent across aiware instances
    """
    resourceAlias: String
    action: PackageResourceAction = ADD
}

enum PackageResourceAction {
    ADD,
    REMOVE
}

enum PackageGrantAction {
    ADD,
    REMOVE
}

