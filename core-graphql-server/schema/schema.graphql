input InitiateMultipartUploadInput {
  """
  The name of the file as it will appear in S3
  """
  fileName: String!
  """
  The content type of the file being uploaded
  """
  contentType: String!
  """
  The size of the file being uploaded, in bytes
  """
  fileSize: Float!
  """
  The number of parts that the file will be split into. This value will determine the number of pre-signed urls
  generated for the upload. The minimum value is 1. If the size of the file is less than 50GB, then the maximum value
  is the file size (in bytes) divided by 5,242,880 bytes (5MB). If the file size is greater than or equal to 50GB,
  then the maximum value is 10,000.
  """
  numberOfParts: Int!
  """
  Optionally, specify the S3 Bucket to upload the file to
  """
  bucket: String
  """
  Optionally, specify a folder to save the file in
  """
  folderName: String
}

type MultipartUploadSessionInfo {
  """
  A list of pre-signed url/part number pairs, each corresponding with a chunk of the file being uploaded
  """
  preSignedUrls: [MultipartPreSignedUrlInfo!]!
  """
  Identifies the file being uploaded
  """
  key: String!
  """
  The ID associated with the multipart-upload session
  """
  uploadId: String!
}

type MultipartPreSignedUrlInfo {
  """
  The pre-signed url that the chunk will be uploaded to
  """
  signedUrl: String!
  """
  The part number of the chunk being uploaded
  """
  partNumber: String!
}

"""
Basic information associated with an uploaded chunk as part of an AWS S3 multipart upload session
"""
input UploadedPartInput {
  """
  The part number of the chunk being uploaded
  """
  PartNumber: String!
  """
  The tag assigned to the uploaded part. The ETag for a part can be found in the headers
  of the response to uploading the part to its respective pre-signed url.
  """
  ETag: String!
}

input CompleteMultipartUploadInput {
  """
  Identifies the file being uploaded
  """
  key: String!
  """
  The ID associated with the multipart-upload session
  """
  uploadId: String!
  """
  All parts that have been uploaded, each with a part number and etag
  """
  parts: [UploadedPartInput!]!
  """
  The bucket provided when initiating the upload. Leave blank if none was provided.
  """
  bucket: String
}

type CompleteMultipartUploadResult {
  """
  The final unsigned URL of the uploaded file
  """
  url: String!
  """
  The final signed URL of the uploaded file
  """
  signedUrl: String!
}

input CancelMultipartUploadInput {
  """
  Identifies the file that was being uploaded
  """
  key: String!
  """
  The ID associated with the multipart-upload session
  """
  uploadId: String!
  """
  The bucket provided when initiating the upload. Leave blank if none was provided.
  """
  bucket: String
}


