# core-job: task payload cleanup
security:
  dataContentRules:
  - objectKey: job.task.payload
    patterns:
    - action: disallow
      regex: 169\.254\.169\.254
      flags: g
      securityNote: 'Link-local instance metadata request (T1522: Cloud Instance Metadata API)'

# core-server-base required
recordingIdParser:
    prefix: mri-
    baseUri: https://api.{{ENVIRONMENT}}.veritone.com/media-streamer

# db query monitor flags
db:
  core_gqm:
    queryMonitor: true
  media_platform_gqm:
    queryMonitor: true
  third_party_gqm:
    queryMonitor: true
  third_party:
    pool:
      idle: 2000
      min: 0

# mailbox settings
mailbox:
  reservedNames:
    exportStatusMailbox: 'Export Request Status Mailbox'
