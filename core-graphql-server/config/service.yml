# The settings in this file are options that should be the same in all environments
# For now we are listing them here as part of the migration from a monolithic config file.
# These could be moved in the corresponding code since they are never modified externally.

# endpoints for various tools
graphqlApiPath: /graphql
graphqlPlaygroundPath: /graphql
graphqlApiPathInternal: /vgraphql
graphqlPlaygroundPathInternal: /vgraphql
graphQLEndpoint: v3/graphql

# Enabled optional schemas
schemas:
  public:
    enabledModules:
      - v3DataModel
    maskedFields:
      - operation: userLogin
        fieldPath: Mutation.userLogin

skipMiddleware: true

# Local caching settings
cache:
  stdTTLSec: 30
  checkPeriodSec: 30
coreAdminRedis:
  detect_buffers: true
  ttl: 10800
redis:
  detect_buffers: true
  ttl: 43200
taskTypeCacheRefreshIntervalMs: 60000

# Service Behavior
# GraphQL query defaults
metricsRange:
  defaultRange: 30
  maxRange: 90
server:
  maxRequestCost: 10000
  requestSizeLimit: 52428800
  validatorSizeLimit: 1mb
paging:
  defaultLimit: 30
  maxLimit: 500
# Periodic kill of long running queries on db connections marked with queryMonitor. Enabled in SCFG.
queryMonitor:
  queryDurationSecondsWarn: 10
# Healthcheck
healthCheck:
  maxAverageResponseTimeMs: 20000
  minRequestsForResponseTime: 100
  path: /health
  maxConcurrentSQL: 1000
log:
  exitOnError: false
  httpLogEnabled: false

# maxRequestTimeElapsedSec: 300
limitShareMentionInBulk: 100


# Data sources
# Elasticsearch library index:
elastic:
  connection:
    apiVersion: '7.0'
  indexName: library
  indexType: _doc

# NSQ
messaging:
  name: nsq
  msgTimeout: 60000
  disableOnFailure: true
  logLevel: warn
  idleTimeout: 1800
  connectionTimeout: 7200

# s3
s3:
  path: assets
  maxRetry: 3
  timeout: 30000
  enableUrlSigning: true

# minio
minio:
  maxRetry: 3
  timeout: 30000
  localDataStorePath: /mnt/data

# Service endpoints
# URL to connect to the api gateway. SCFG define baseUri
veritone-api:
  maxRetry: 3
  retryIntervalMs: 5000


# DB migration schema. SCFG controls the enable/disable flag
flyway:
  path: /usr/local/bin/flyway
  configPath: flyway/conf
  lockTTLMs: 180000
  maxWaitMs: 60000
  baseDelayMs: 50
  maxDelayMs: 5000
  lockExtendThresholdMs: 30000
  sentinelTTLSec: 86400
  db:
    audience:
      configPath: flyway/db/audience
      scriptPath:
        - flyway/db/audience/sql

    cms:
      configPath: flyway/db/cms
      scriptPath:
        - flyway/db/cms/sql

    media_platform:
      configPath: flyway/db/media_platform
      scriptPath:
        - flyway/db/media_platform/sql

    platform:
      dbKey: core
      configPath: flyway/db/platform
      scriptPath:
        - flyway/db/platform/sql

    sso:
      configPath: flyway/db/sso
      scriptPath:
        - flyway/db/sso/sql

    structured_data:
      dbKey: third_party
      configPath: flyway/db/structured_data
      scriptPath:
        - flyway/db/structured_data/sql

    subscription:
      configPath: flyway/db/subscription
      scriptPath:
        - flyway/db/subscription/sql

