extend type Query {
    """
    Query instance audit log configuration that includes:
    - pool of events that are stored for audit purposes. Every instance is created
    with a default subset of auditable events
    """
    instanceAuditLogConfig: InstanceAuditLogConfig @scopes(scopes: ["superadmin", "aiware.admin.instance_admin", "veritone.superadmin", "aiware.admin.superadmin"] require: Any)

    """
    Examine entries from the audit log.
    Instance admins choose what events' data is stored in audit log sink(s)
    Instance admins can query all entries.
    Org admins can query their respective org entries.
    Non-admin users can query certain entries created as a result of their activity
    All queries are bracketed by a time window.
    A default time window is applied if the toDateTime and/or
    fromDateTime parameters are not provided.
    The maximum time window length is 365 days.
    """
    instanceAuditLog(
        input: InstanceAuditLogInput
    ): InstanceAuditLogEntryList!

    auditLogExportRequest(
        id: ID!
    ): AuditLogExportRequest @scopes(scopes: ["superadmin", "aiware.admin.instance_admin", "veritone.superadmin", "aiware.admin.superadmin", "admin.org.read"] require: Any)

    auditLogExportRequestForOrg(
        organizationId: ID!
        statuses: [AuditExportRequestStatus]
    ): AuditLogExportRequestList @scopes(scopes: ["superadmin", "aiware.admin.instance_admin", "veritone.superadmin", "aiware.admin.superadmin", "admin.org.read"] require: Any)
}

extend type Mutation {
    """
    Configure instance audit rules by adding or removing events that should be stored for audit.
    """
    updateInstanceAuditLogConfig(
        input: InstanceAuditLogConfigInput
    ): InstanceAuditLogConfig @scopes(scopes: ["superadmin", "aiware.admin.instance_admin", "veritone.superadmin", "aiware.admin.superadmin"] require: Any)

    """
    Creates and queues export request of audit logs for an organization
    """
    createAuditLogExportRequest(filters: AuditLogExportRequestFilterInput): AuditLogExportRequest @scopes(scopes: ["superadmin", "aiware.admin.instance_admin", "veritone.superadmin", "aiware.admin.superadmin", "admin.org.read"] require: Any)

    """
    Cancels an audit log export request that is pending or in progress. Returns true if the request was successfully cancelled.
    """
    cancelAuditLogExportRequest(id: ID!): Boolean @scopes(scopes: ["superadmin", "aiware.admin.instance_admin", "veritone.superadmin", "aiware.admin.superadmin", "admin.org.read"] require: Any)
}

