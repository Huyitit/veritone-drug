    """
    Indicates the service involved in the audit action.
    """
    originatorService: String
    """
    The userId that creates the action involved in the audit action on behalf of a user via impersonation.
    """
    impersonatorUserId: ID
    """
    The username that creates the action involved in the audit action on behalf of a user via impersonation.
    """
