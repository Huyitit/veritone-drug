  User,
  Group
}

union AuthResourceMember = TemporalDataObject | StructuredData | Folder | Source  | Organization | Engine | Library | Dataset | Application


"""
Authorization Group
"""
type AuthGroup {
  """
  Unique id of the group
  """
  id: ID!

  """
  Name of the group. limited to 100 characters
  """
  name: String!

  """
  Brief and informative description of the group scope and purpose
  """
  description: String!

  """
  Owner organization set during group creation (or the user's organization if none is specified)
  """
  organization: OrganizationInfo!

  """
  If true, the group is a system group
  """
  isSystem: Boolean
  @deprecated(
      reason: "Replaced by isProtected field"
      alternate: "isProtected"
      expirationDate: "2023-01-01"
      deprecationDate: "2022-11-01"
    )
  """
  If true, the group is a protected group
  """
  isProtected: Boolean!

  authClass: AuthObjectClass

  """
  Source of the group
  """
  source: AuthGroupSourceType!,

  """
  Optional field to store the appRoleID if the group is created by an app
  """
  appRole: Role,

  """
  A list of current group's immediate parent authorization groups
  """
  parentGroups: AuthGroupList

  
  """
  A list of TDOs that are protected by ACE(s) containing current group
  """
  referencedTDOs(offset: Int=0, limit: Int=30): TDOList,
    @deprecated(
      reason: "not implemented"
      alternate: "AuthACE.permissionSet"
      expirationDate: "2026-04-01"
      deprecationDate: "2025-10-01"
    )

  referencedACEs(offset: Int=0, limit: Int=30): [AuthACE],
    @deprecated(
        reason: "not implemented"
        alternate: "AuthACE.permissionSet"
        expirationDate: "2026-04-01"
        deprecationDate: "2025-10-01"
      )

  organizationACEs(offset: Int=0, limit: Int=30): [AuthACE],
    @deprecated(
        reason: "not implemented"
        alternate: "AuthACE.permissionSet"
        expirationDate: "2026-04-01"
        deprecationDate: "2025-10-01"
      )

  """
  A list of folders that are protected by ACE(s) containing current group
  """
  referencedFolders(folderID: ID, folderNameRegexp: String, parentFolderID: ID): FolderList,

  """
  List of users and groups that are members of the current group
  """
  members(
    ids: [ID!]
    memberType: AuthGroupMemberType
    offset: Int = 0
    limit: Int = 30
  ): AuthGroupMemberList!,

  memberCount: Int

  """
  Permission set(s) applied to the group
  """
  permissionSet: [AuthPermissionSet]
    @deprecated(
      reason: "not implemented"
      alternate: "AuthACE.permissionSet"
      expirationDate: "2026-04-01"
      deprecationDate: "2025-10-01"
    )


  # @hasRole(scope: Organization, permissions: ["org::auth_group_members.r"])
  createdAt: DateTime!
  modifiedAt: DateTime!

  createdBy: BasicUserInfo!
  modifiedBy: BasicUserInfo!
}

type AuthGroupList implements Page {
  records: [AuthGroup]!
  offset: Int!
  limit: Int!
  count: Int!
}

union AuthGroupMember = User | AuthGroup

type AuthGroupMemberEntry {
  member: AuthGroupMember!
  createdAt: DateTime!
  modifiedAt: DateTime!
}

type AuthGroupMemberList implements Page {
  records: [AuthGroupMemberEntry]!
  offset: Int!
  limit: Int!
  count: Int!
}

"""
Access Control Entry
"""
type AuthACE {
  id: ID!
  """
  Type of object referenced by ACE
  """
  objectType: AuthResourceType

  """
  Object ID
  """
  objectID: ID!

  """
  Group or User granted the permission set on the object
  """
  member: AuthResourceOwner!

  """
  Permission Set
  """
  permissionSet: AuthPermissionSet!

  """
  If protected, this ACE cannot be removed
  """
  isProtected: Boolean!

  """
  Organization
  """
  organization: OrganizationInfo!

  createdAt: DateTime
  modifiedAt: DateTime

  createdBy: BasicUserInfo!
  modifiedBy: BasicUserInfo!

  """
  Flags controlling specific ACE default policy behaviors
  """
  options: [String!]
}

"""
This is the Auth Access Control List for a particular resource
"""
type AuthACL implements Page {
  records: [AuthACE]!
  offset: Int!
  limit: Int!
  count: Int!
}

enum AuthObjectClass {
  Internal,
  System,
  Application,
  Standard
}

"""
Permission Set: set of permission grants, managed as a cohesive entity
"""
type AuthPermissionSet {
  """
  Unique id of the Permission Set
  """
  id: ID!
  """
  Name of the Permission Set
  """
  name: String!
  """
  Brief description of the Permission Set
  """
  description: String

  """
  Owner organization
  """
  organization: OrganizationInfo!

  """
  Application that created this Permission Set
  """
  application: Application

  """
  This is the approle if this permission set comes from an app role
  """
  applicationRole: Role

  """
  Requires: superadmin
  List of lib-functional-permissions permissions, ex. recording:read, job:create
  """
  permissions: [AuthPermissionType!]!

  """
  This is the set of ACEs that use this permission set
  """
  referencedACEs(offset: Int=0, limit: Int=30): [AuthACE],

  hasPermissions(permissions: [AuthPermissionType!]!, requireAll: Boolean = true): Boolean!

  protected: Boolean
  @deprecated(
      reason: "Replaced by isProtected field"
      alternate: "isProtected"
      expirationDate: "2023-01-01"
      deprecationDate: "2022-11-01"
    )
  """
  If protected, this permission set cannot be updated or removed
  """
  isProtected: Boolean!

  createdAt: DateTime
  modifiedAt: DateTime

  createdBy: BasicUserInfo
  modifiedBy: BasicUserInfo

  authClass: AuthObjectClass
}

type AuthPermissionSetList implements Page {
  records: [AuthPermissionSet]!
  offset: Int!
  limit: Int!
  count: Int!
}

