# Resource Audit types

"""
Input type for identifying a specific resource in the system
"""
input InputResourceIdentifier {
  """
  The type of resource (TDO, SDO, Folder, Library, etc.)
  """
  resourceType: AuthResourceType!

  """
  The unique identifier of the resource
  """
  resourceId: ID!
}

"""
Identifies a specific resource in the system
"""
type ResourceIdentifier {
  """
  The type of resource (TDO, SDO, Folder, Library, etc.)
  """
  resourceType: AuthResourceType!

  """
  The unique identifier of the resource
  """
  resourceId: ID!
}


"""
Complete audit report of a user's permissions on a specific resource
"""
type PermissionAudit {
  """
  The resource that was audited
  """
  resource: ResourceIdentifier!

  """
  The user whose permissions were audited
  """
  userId: ID!

  """
  List of all permissions the user effectively has on this resource.
  This is a flattened summary of all granted permissions.
  """
  effectivePermissions: [AuthPermissionType!]!

  """
  Detailed breakdown of how each permission was granted.
  Includes the source and reasoning for each permission.
  """
  permissionDetails: [PermissionGrantAudit]!
}

"""
Detailed audit information for a specific permission
"""
type PermissionGrantAudit {
   """
   The permission granted
   """
   permission: AuthPermissionType!

   """
   Human-readable explanation of why this permission was granted.
   Examples: "Direct grant", "Inherited from parent folder", "Organization admin role"
   """
   reason: String!

   """
   All the specific grants that contribute to this permission.
   Multiple grants may exist if permission comes from multiple sources.
   """
   grants: [PermissionGrant!]!
}

"""
The different ways a permission can be granted to a user
"""
enum PermissionGrantType {
    """
    Permission granted directly to the user on this specific resource
    """
    Direct

    """
    Permission granted through membership in a group that has access
    """
    GroupMembership

    """
    Permission granted through the organization level access control entry
    """
    OrganizationRole

    """
    Permission inherited from a parent resource (e.g., folder permissions)
    """
    ParentResource
}

union AuthResourceOwner = BasicUserInfo | AuthGroup

"""
A specific grant that contributes to a user's permission on a resource
"""
type PermissionGrant {
   """
   The mechanism by which this permission was granted
   """
   type: PermissionGrantType!

   """
   The permission set that contains the permission
   """
   permissionSet: AuthPermissionSet!

   """
