# =============================================================================
# Distribution Center (VP-2581)
# Seeded catalog of distribute targets (DestinationType) + org-scoped, OAuth-
# connected publish channels (Destination).
# =============================================================================

"""Lifecycle state of a Destination's connection to its vendor (e.g. Ayrshare)."""
enum DestinationStatus {
  """Created; awaiting completion of the vendor OAuth handshake."""
  PENDING_OAUTH
  """OAuth complete and verified; ready to distribute."""
  CONNECTED
  """Previously connected, now intentionally detached."""
  DISCONNECTED
  """Connection is in an error state (e.g. vendor reports the link was revoked)."""
  ERROR
}

"""Seeded catalog entry describing a distribute target (e.g. YouTube via Ayrshare)."""
type DestinationType {
  id: ID!

  """Human-readable name, e.g. "YouTube"."""
  name: String!

  """Platform key, e.g. "youtube", "instagram", "tiktok"."""
  platform: String!

  """Coarse capability tag, e.g. "social-publish"."""
  vendorCapability: String!

  iconClass: String

  """UUID of the aiWare Engine that runs distribute jobs for this DestinationType."""
  engineId: ID!

  """The aiWare Engine joined on engineId."""
  engine: Engine

  """JSON Schema that Destination.details must conform to; validated server-side."""
  configSchema: Schema
  configSchemaId: ID!

  """JSON Schema that DistributeAssetInput.platformPayload must conform to; validated server-side."""
  publishSchema: Schema
  publishSchemaId: ID!

  """
  Declared media constraints for this destination, one entry per vendor post type. Read these rather than
  hardcoding platform limits, which drift from what the vendor actually enforces.

  Clients MUST NOT gate submission on a constraint absent from `enforcedConstraints` — the rest are published
  for display, and blocking on them will reject media the platform accepts. Empty list means nothing is
  declared and no pre-flight check applies.
  """
  mediaConstraints: [MediaConstraint!]!

  isPublic: Boolean
  createdDateTime: DateTime
  modifiedDateTime: DateTime
}

"""
Media constraints a destination's platform imposes, for one vendor post type.

`hard*` values are the platform's rejection thresholds; `recommended*` are quality guidance only, which the
platform accepts media below.

**Declared does not mean enforced — check `enforcedConstraints` before gating on any field.** Today only
`DURATION` is enforced: the published asset is a downscaled preview rendition, so checking its dimensions would
reject assets whose masters are publishable. Dimension and aspect enforcement is sequenced behind VE-26886; the
values are published now so there is one source of truth when it lands.

A null field means that constraint is not declared for this post type.
"""
type MediaConstraint {
  id: ID!

  """Vendor post type these limits apply to, e.g. "reels"."""
  postType: String!

  """
  Which constraint classes on this row are validated server-side, and are therefore safe to gate submission on.
  """
  enforcedConstraints: [MediaConstraintClass!]!

  """
  The rejection thresholds, as a JSON Schema (draft-07) over the asset's measured properties.

  Run it client-side to warn before submitting: the server evaluates this same document with ajv configured to
  match `@rjsf/validator-ajv8`, so both sides reach the same verdict.

  Recognised properties are `durationMs` (MILLISECONDS, directly comparable to `Asset.fileData.mediaDurationMs`),
  `widthPx`, `heightPx` and `aspectRatio` (width/height). Only `minimum`, `maximum` and `enum` appear.

  A property present here is NOT necessarily checked by the server — `enforcedConstraints` is the list of what
  is. Validate an asset by supplying only the properties you can measure; absent properties are not checked, and
  the document never uses `required`.

  `{}` means nothing is declared.
  """
  constraintSchema: JSONData!

  """
  Advisory quality targets, e.g. `{"widthPx": 1080, "heightPx": 1920, "aspectRatio": 0.5625}`.

  NEVER rejection thresholds — the platform accepts media that misses them, so show them as guidance and do not
  gate submission on them. `constraintSchema` is what can reject a publish.

  Keys are the property names `constraintSchema` uses, so a target lines up against its limit. Unlike
  `constraintSchema` this is a flat map of values, NOT a JSON Schema: do not pass it to a validator.

  `{}` means no guidance is published for this destination.
  """
  recommendedMedia: JSONData!
}

"""
A class of media constraint, used to say which ones are enforced server-side.

New members may be added as enforcement expands. Clients MUST tolerate an unrecognised value and treat it as
NOT gateable — a client contract with no schema-level enforcement, since GraphQL has no tolerant-enum mechanism.
If a fourth class lands and client tolerance proves impractical, the fallback is a parallel
`enforcedConstraintKeys: [String!]!`.
"""
enum MediaConstraintClass {
  """Media duration, validated against Asset.fileData.mediaDurationMs in milliseconds."""
  DURATION
  """Pixel width and height."""
  DIMENSIONS
  """Aspect ratio (width/height)."""
  ASPECT_RATIO
}

"""An org-scoped publish channel: 1:1 to a vendor (Ayrshare) User Profile / social account."""
type Destination {
  id: ID!
  destinationTypeId: ID!
  destinationType: DestinationType
  label: String!

  """Must conform to destinationType.configSchema; validated server-side at every write."""
  details: JSONData

  """Ayrshare Profile-Key — opaque credential, restricted to org admins."""
  vendorProfileId: String!
    @scopes(scopes: ["admin.org.update"])

  """Linked social-account label, e.g. "@channel-name"."""
  platformAccountLabel: String

  status: DestinationStatus!

  """Short-lived vendor OAuth URL while status is PENDING_OAUTH; null once CONNECTED."""
  oauthUrl: String
  oauthUrlExpiresAt: DateTime

  createdBy: User
  createdDateTime: DateTime!
  modifiedDateTime: DateTime
}

"""The Ayrshare Profile-Key for a destination, transit-encrypted for the engine. Engine-only."""
type DestinationVendorProfile {
  """
  The Profile-Key encrypted under the core/engine shared secret (AES-256-GCM, envelope `iv::ciphertext::authTag`,
  base64 segments). The engine decrypts with the shared secret; the plaintext key is never sent over the wire.
  """
  vendorProfileIdEncrypted: String!
}

input CreateDestinationInput {
  destinationTypeId: ID!
  label: String!

  """Must conform to the DestinationType.configSchema; validated server-side."""
  details: JSONData
}

input UpdateDestinationInput {
  id: ID!
  label: String

  """Partial update; merged onto current details then re-validated against configSchema."""
  details: JSONData
}

input CompleteDestinationConnectionInput {
  id: ID!
}

input RefreshDestinationOAuthUrlInput {
  id: ID!
}

input DistributeAssetInput {
  """Target TDO ids. For MVP the server errors if more than one is supplied.
     Each must resolve to a TDO in the caller's org."""
  tdoIds: [ID!]!
  destinationId: ID!

  """Must conform to destination.destinationType.publishSchema. Validated server-side."""
  platformPayload: JSONData!
}

extend type Mutation {
  createDestination(input: CreateDestinationInput!): Destination!
    @scopes(scopes: ["aiware.destination.create"])
  updateDestination(input: UpdateDestinationInput!): Destination!
    @scopes(scopes: ["aiware.destination.update"])
  deleteDestination(id: ID!): DeletePayload
    @scopes(scopes: ["aiware.destination.delete"])
  """Confirms the OAuth handshake and flips status PENDING_OAUTH -> CONNECTED."""
  completeDestinationConnection(input: CompleteDestinationConnectionInput!): Destination!
    @scopes(scopes: ["aiware.destination.update"])
    @audit(action: Update)

  """Issues a fresh vendor OAuth URL for an existing destination that is not yet CONNECTED, so an
     abandoned or failed handshake can be retried without deleting and recreating the destination.
     Reuses the destination's existing vendor profile — no new profile is created. The returned
     `oauthUrl` is short-lived (see `oauthUrlExpiresAt`); request it at the moment of use rather than
     caching it. Sets status back to PENDING_OAUTH (a retry is allowed from DISCONNECTED and ERROR
     too), so `oauthUrl` is only ever populated on a PENDING_OAUTH row. Errors on a CONNECTED
     destination. The write is guarded on the same condition, so a destination connected concurrently is
     never downgraded — though a refresh that commits before that connect lands still succeeds."""
  refreshDestinationOAuthUrl(input: RefreshDestinationOAuthUrlInput!): Destination!
    @scopes(scopes: ["aiware.destination.update"])
    @audit(action: Update)

  """Submits an aiWare Job to distribute the asset. Returns the Job immediately —
     success means the job was submitted, not that the vendor accepted the post."""
  distributeAsset(input: DistributeAssetInput!): Job!
    @scopes(scopes: ["aiware.destination.read"])
    @audit(action: Create)
}

