    name: aiware_core:sso:read
    params:
      max: 10
      readonly: true
  - resourceType: postgres
    name: aiware_core:subscription
    params:
      max: 10
  - resourceType: postgres
    name: aiware_core:subscription:read
    params:
      max: 10
      readonly: true
  - resourceType: postgres
    name: aiware_core:third_party
    params: {}
  - resourceType: postgres
    name: aiware_core:third_party:read
    params:
      readonly: true
  - resourceType: postgres
    name: aiware_core:third_party_gqm
    params:
      max: 2
  - resourceType: es
    name: aiware_core:elastic
    params:
      connection:
        host: ''
        apiVersion: '6.0'
