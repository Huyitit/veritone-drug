resources:
  - resourceType: nsq
    name: aiware_core:messaging
    params:
      nsqdHost: ''
      nsqdPort: 4150
      nsqlookupds:
        - nsqlookupd.service.consul:4161
      nsqlookupdDiscovery: false
      tls: false
      tlsVerification: false
  - resourceType: minio
    name: aiware_core:minio
    params:
      enabled: false
      enableUrlSigning: true
      signedUrlExpires: 604800
      accessKey: ''
      secretKey: ''
      bucket: aiware
      path: asset
      endPoint: minio-1
      port: 9101
      secure: false
  - resourceType: redis
    name: aiware_core:coreAdminRedis
    params:
      host: ''
      port: 6379
      password: ''
  - resourceType: redis
    name: aiware_core:redis
    params:
      host: ''
      port: 6379
      password: ''
  - resourceType: postgres
    name: aiware_core:audience
    params:
      max: 10
  - resourceType: postgres
    name: aiware_core:audience:read
    params:
      max: 10
      readonly: true
  - resourceType: postgres
    name: aiware_core:cms
    params:
      max: 10
  - resourceType: postgres
    name: aiware_core:cms:read
    params:
      max: 10
      readonly: true
  - resourceType: postgres
    name: aiware_core:core
    params:
      max: 10
  - resourceType: postgres
    name: aiware_core:core:read
    params:
      max: 10
      readonly: true
  - resourceType: postgres
    name: aiware_core:core_gqm
    params:
      max: 2
  - resourceType: postgres
    name: aiware_core:media_platform
    params:
      max: 10
  - resourceType: postgres
    name: aiware_core:media_platform:read
    params:
      max: 10
      readonly: true
  - resourceType: postgres
    name: aiware_core:media_platform_gqm
    params:
