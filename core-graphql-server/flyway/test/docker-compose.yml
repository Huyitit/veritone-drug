version: '3.8'
services:
  # Postgres
  postgres:
    image: postgres:13
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: "postgres"
    ports:
      - "5432:5432"
    volumes:
      - ./db:/docker-entrypoint-initdb.d

  redis:
    image: redis:alpine
    hostname: redis
    ports:
      - "6379:6379"

  nsqlookupd:
    image: nsqio/nsq:v1.2.1
    command: /nsqlookupd
    ports:
      - "4160:4160"
      - "4161:4161"
    healthcheck:
      test: ["CMD-SHELL", "/usr/bin/wget -q -s http://0.0.0.0:4161/ping && exit 0 || exit 1"]

  nsqd:
    image: nsqio/nsq:v1.2.1
    command: /nsqd --lookupd-tcp-address=nsqlookupd:4160 --broadcast-address 127.0.0.1
    depends_on:
      - nsqlookupd
    ports:
      - "4150:4150"
      - "4151:4151"
    stop_signal: SIGTERM
    healthcheck:
      test: ["CMD-SHELL", "/usr/bin/wget -q -s http://0.0.0.0:4151/ping && exit 0 || exit 1"]